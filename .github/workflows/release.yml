name: Release

# Publishing is driven by an annotated tag: `git tag -a v1.0.0 -m v1.0.0`
# followed by `git push --tags`. Tag a commit the CI workflow already passed on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can trace back to a commit, and PyPI uploads cannot be undone.
      - name: Tag matches the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check --strict dist/*

      # Installs the wheel that is about to ship, not the source tree, so a
      # missing module or a broken console script fails here instead of on PyPI.
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/vrtx list

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires a Trusted Publisher registered on PyPI for this repository and
    # workflow; no API token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/p/vrtx
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
